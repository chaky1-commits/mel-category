<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MEL Category</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="MEL Cat">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#000;--card:#222;--gr:#14e61e;--dim:#8d8d8d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:#fff;font-family:"Noto Sans KR","Segoe UI",Roboto,system-ui,sans-serif;padding:16px}
.wrap{max-width:460px;margin:0 auto}
.tabs{display:flex;justify-content:space-around;margin:0 0 24px}
.tabs button{border:0;background:none;padding:6px 10px;color:var(--dim);font:inherit;font-size:14px;font-weight:500}
.tabs button.on{color:#fff;font-weight:700}
.dr{display:flex;align-items:center;justify-content:center;gap:14px}
.arr{border:0;background:var(--card);color:var(--dim);border-radius:12px;width:36px;height:36px;font-size:13px}
.date{position:relative;font-size:min(5vw,24px);font-weight:500;font-style:italic;padding:4px 6px}
.date span{text-decoration:underline;text-underline-offset:4px}
.date input{position:absolute;inset:0;width:100%;height:100%;opacity:0}
.time{text-align:center;margin-top:18px;font-size:min(7.5vw,36px);font-weight:800;color:var(--gr);letter-spacing:1px;font-variant-numeric:tabular-nums;line-height:1.1}
.note{text-align:center;min-height:16px;margin-top:4px;color:var(--dim);font-size:11px}
.list{margin-top:46px;display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lab{background:var(--card);border-radius:14px;padding:10px 6px;font-size:13px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.lab small{font-size:11px;font-weight:400;color:#ddd}
.lab.a{cursor:pointer;user-select:none}
.u{text-decoration:underline;text-underline-offset:3px}
.val{display:flex;align-items:center;justify-content:center;border:2px solid #fff;border-radius:14px;background:#0e0e0e;font-size:15px;font-weight:700;letter-spacing:.3px}

</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" id="tabs">
    <button data-z="UTC" class="on">UTC</button><button data-z="KST">KST</button><button data-z="LOCAL">Local</button>
  </div>
  <div class="dr">
    <button class="arr" id="minus">◀</button>
    <div class="date"><span id="date"></span><input type="date" id="picker"></div>
    <button class="arr" id="plus">▶</button>
  </div>
  <div class="time" id="time"></div>
  <div class="note" id="note"></div>
  <div class="list">
    <div class="row"><div class="lab a" id="alab"><span class="u">Category A</span><small id="asub">+1 day</small></div><div class="val a" id="vA"></div></div>
    <div class="row"><div class="lab">Category B<small>+3 days</small></div><div class="val" id="vB"></div></div>
    <div class="row"><div class="lab">Category C<small>+10 days</small></div><div class="val" id="vC"></div></div>
    <div class="row"><div class="lab">Category D<small>+120 days</small></div><div class="val" id="vD"></div></div>
  </div>
</div>
<script>
(function(){
  var zone="UTC", aDays=1, manual=null;
  var OFFS={UTC:0,KST:9};
  var p2=function(n){return String(n).padStart(2,"0")};
  var MON=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
  function now(){
    var n=new Date();
    if(zone==="LOCAL") return {y:n.getFullYear(),m:n.getMonth(),d:n.getDate(),h:n.getHours(),i:n.getMinutes(),s:n.getSeconds()};
    var u=new Date(n.getTime()+OFFS[zone]*3600000);
    return {y:u.getUTCFullYear(),m:u.getUTCMonth(),d:u.getUTCDate(),h:u.getUTCHours(),i:u.getUTCMinutes(),s:u.getUTCSeconds()};
  }
  function addDays(b,n){var t=new Date(Date.UTC(b.y,b.m,b.d+n));return {y:t.getUTCFullYear(),m:t.getUTCMonth(),d:t.getUTCDate()}}
  function fmt(x){return p2(x.d)+"-"+MON[x.m]+"-"+x.y}
  function curBase(){var n=now();return manual||{y:n.y,m:n.m,d:n.d}}
  function render(){
    var n=now(), base=curBase();
    document.getElementById("date").textContent=fmt(base);
    document.getElementById("time").textContent=p2(n.h)+":"+p2(n.i)+":"+p2(n.s);
    document.getElementById("note").textContent=manual?"기준일 수동 지정됨":"";
    document.getElementById("asub").textContent="+"+aDays+(aDays===1?" day":" days");
    document.getElementById("vA").textContent=fmt(addDays(base,aDays));
    document.getElementById("vB").textContent=fmt(addDays(base,3));
    document.getElementById("vC").textContent=fmt(addDays(base,10));
    document.getElementById("vD").textContent=fmt(addDays(base,120));
    var pk=document.getElementById("picker"), v=base.y+"-"+p2(base.m+1)+"-"+p2(base.d);
    if(pk.value!==v) pk.value=v;
  }
  document.getElementById("tabs").addEventListener("click",function(e){
    var b=e.target.closest("button"); if(!b) return;
    zone=b.dataset.z;
    [].forEach.call(this.children,function(c){c.classList.toggle("on",c===b)});
    render();
  });
  document.getElementById("alab").addEventListener("click",function(){
    var A=[1,3,10,120]; aDays=A[(A.indexOf(aDays)+1)%A.length]; render();
  });
  document.getElementById("picker").addEventListener("change",function(e){
    var v=e.target.value.split("-"); if(v.length!==3) return;
    manual={y:+v[0],m:+v[1]-1,d:+v[2]}; render();
  });
  document.getElementById("minus").onclick=function(){manual=addDays(curBase(),-1);render()};
  document.getElementById("plus").onclick=function(){manual=addDays(curBase(),1);render()};
  render(); setInterval(render,1000);
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
